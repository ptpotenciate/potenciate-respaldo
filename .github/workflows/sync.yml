name: Sincronizar temario desde Cloudflare

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests del generador
        run: node --test scripts/sync.test.mjs
      - name: Instalar wrangler
        run: npm install --global wrangler@4
      # Cuántos temas tiene el respaldo que ya está publicado. Sirve para no sustituir una
      # copia buena por una vacía si algo falla al leer Cloudflare. La primera vez la rama
      # no existe todavía, y entonces cuenta cero.
      - name: Ver el respaldo anterior
        id: anterior
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: data
          path: anterior
      - name: Contar el temario del respaldo anterior
        id: contar
        run: echo "temas=$(ls anterior/*.bin 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Descargar el temario visible y generar el sitio cifrado
        run: node scripts/sync-cloudflare.mjs
        env:
          TEMAS_ANTERIORES: ${{ steps.contar.outputs.temas }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          FALLBACK_PASSWORD: ${{ secrets.FALLBACK_PASSWORD }}
      - name: Guardar el sitio cifrado en la rama "data"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./staging
          publish_branch: data
          force_orphan: true
