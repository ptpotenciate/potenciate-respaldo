name: Sincronizar temario desde Cloudflare

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests del generador
        run: node --test scripts/sync.test.mjs
      - name: Instalar wrangler
        run: npm install --global wrangler@4
      - name: Descargar el temario visible y generar el sitio cifrado
        run: node scripts/sync-cloudflare.mjs
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          FALLBACK_PASSWORD: ${{ secrets.FALLBACK_PASSWORD }}
      - name: Guardar el sitio cifrado en la rama "data"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./staging
          publish_branch: data
          force_orphan: true
