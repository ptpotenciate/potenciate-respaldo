name: Desactivar página de emergencia

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  desactivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dejar solo el aviso "No disponible"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./placeholder
          publish_branch: gh-pages
          force_orphan: true
