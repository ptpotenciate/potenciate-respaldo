name: Desactivar página de emergencia

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desactivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vaciar la página pública (deja solo el aviso)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./placeholder
          publish_branch: gh-pages
          force_orphan: true
