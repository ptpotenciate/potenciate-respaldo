name: Activar página de emergencia

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
          path: site
      - run: rm -rf site/.git
      - name: Publicar el último temario sincronizado
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
